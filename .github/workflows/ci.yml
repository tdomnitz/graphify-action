name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tdomnitz/graphify-action
          tags: ci

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=ghcr.io/tdomnitz/graphify-action:buildcache
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Shellcheck entrypoint.sh
        run: docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:stable entrypoint.sh
