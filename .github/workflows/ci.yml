name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t graphify-action:ci .

      - name: Shellcheck entrypoint.sh
        run: docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:stable entrypoint.sh
