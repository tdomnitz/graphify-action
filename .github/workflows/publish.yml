name: Publish image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          major="v${version%%.*}"
          minor="v${version%%.*.*}"
          echo "full=v${version}" >> "$GITHUB_OUTPUT"
          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "minor=${minor}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tdomnitz/graphify-action
          tags: |
            ${{ steps.tags.outputs.full }}
            ${{ steps.tags.outputs.major }}
            ${{ steps.tags.outputs.minor }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=ghcr.io/tdomnitz/graphify-action:buildcache
          cache-to: type=registry,ref=ghcr.io/tdomnitz/graphify-action:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
